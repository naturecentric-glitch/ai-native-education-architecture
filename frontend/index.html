<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 AI-Native Education Platform</title>
    <style>
        :root {
            --primary: #4A90D9;
            --primary-dark: #2C5F8A;
            --success: #2ECC71;
            --warning: #F39C12;
            --danger: #E74C3C;
            --bg: #F5F7FA;
            --card: #FFFFFF;
            --text: #2C3E50;
            --text-light: #7F8C8D;
            --border: #E1E8ED;
            --radius: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        /* ── Hero ───────────────────────────────────────────── */
        .hero {
            background: linear-gradient(135deg, #4A90D9 0%, #2C5F8A 50%, #1A3A5C 100%);
            color: white;
            text-align: center;
            padding: 3rem 2rem 2rem;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            animation: float 20s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }
        .hero h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.4rem;
            position: relative;
        }
        .hero p {
            font-size: 1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }
        .hero .stats {
            margin-top: 1rem;
            font-size: 0.85rem;
            opacity: 0.8;
            position: relative;
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .hero .stats span { font-weight: 700; }

        /* ── Search & Filters ───────────────────────────────── */
        .controls {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem 1.5rem 0;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 0.7rem 1rem 0.7rem 2.5rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: var(--primary); }
        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
        }

        .filter-bar {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.45rem 0.9rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* ── Grade Sections ─────────────────────────────────── */
        .main-content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        .grade-section {
            margin-bottom: 2rem;
        }
        .grade-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border);
        }
        .grade-label {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text);
        }
        .grade-count {
            font-size: 0.75rem;
            background: var(--primary);
            color: white;
            padding: 0.15rem 0.55rem;
            border-radius: 10px;
            font-weight: 600;
        }
        .grade-section.hidden { display: none; }

        /* ── Course Grid ────────────────────────────────────── */
        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
        }
        .course-card {
            background: var(--card);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            border: 2px solid transparent;
        }
        .course-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            border-color: var(--primary);
        }
        .course-card.hidden { display: none; }
        .course-card .card-banner {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            position: relative;
        }
        .course-card .card-banner::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 20px;
            background: linear-gradient(to top, var(--card), transparent);
        }
        .course-card .card-body {
            padding: 0.9rem 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .course-card .card-body h3 {
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
            line-height: 1.3;
        }
        .course-card .card-body .description {
            font-size: 0.78rem;
            color: var(--text-light);
            flex: 1;
            margin-bottom: 0.75rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .course-card .card-meta {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        .badge {
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge.board { background: #E8F5E9; color: #2E7D32; }
        .badge.subject { background: #FFF3E0; color: #E65100; }

        /* ── Expansion notice ────────────────────────────────── */
        .expansion-bar {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0.75rem 1.5rem;
        }
        .expansion-notice {
            background: linear-gradient(135deg, #FFF8E1, #FFF3E0);
            border: 1px solid #FFE082;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .expansion-notice .pulse {
            width: 10px; height: 10px;
            background: #F39C12;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* ── No results ─────────────────────────────────────── */
        .no-results {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-light);
            display: none;
        }

        /* ── Loading ────────────────────────────────────────── */
        .loading-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-light);
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Footer ─────────────────────────────────────────── */
        .footer {
            text-align: center;
            padding: 2rem;
            font-size: 0.8rem;
            color: var(--text-light);
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }
        .footer a { color: var(--primary); text-decoration: none; }

        @media (max-width: 600px) {
            .hero h1 { font-size: 1.6rem; }
            .hero { padding: 2rem 1rem 1.5rem; }
            .course-grid { grid-template-columns: 1fr; }
            .controls { padding: 1rem; }
            .filter-btn { padding: 0.35rem 0.7rem; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

<!-- Hero -->
<div class="hero">
    <h1>🎓 AI-Native Education</h1>
    <p>Mastery-based learning powered by AI — Class 1 to 12, all NCERT subjects.</p>
    <div class="stats" id="heroStats"></div>
</div>

<!-- Search & Filters -->
<div class="controls">
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search courses — math, science, class 10, hindi..." autocomplete="off">
    </div>
    <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-filter="all" id="btnAll">All</button>
    </div>
</div>

<!-- Expansion status -->
<div class="expansion-bar" id="expansionBar" style="display:none">
    <div class="expansion-notice">
        <div class="pulse"></div>
        <span id="expansionText">AI is expanding course curricula in the background...</span>
    </div>
</div>

<!-- Loading -->
<div id="loadingState" class="loading-state">
    <div class="spinner"></div>
    <p>Loading courses...</p>
</div>

<!-- Main Content -->
<div class="main-content" id="mainContent" style="display:none">
    <div class="no-results" id="noResults">
        <p style="font-size:2rem;margin-bottom:0.5rem">🔍</p>
        <p>No courses match your search.</p>
    </div>
</div>

<!-- Footer -->
<div class="footer">
    AI-Native Education Platform &middot; Built with Gemini AI &middot;
    <a href="https://github.com/naturecentric-glitch/ai-native-education-architecture" target="_blank">GitHub</a>
</div>

<script>
let allCourses = [];
let activeFilter = 'all';

const GRADE_LABELS = {
    0: '🎯 Competitive & General',
    1: '📗 Class 1', 2: '📗 Class 2', 3: '📗 Class 3',
    4: '📘 Class 4', 5: '📘 Class 5',
    6: '📙 Class 6', 7: '📙 Class 7', 8: '📙 Class 8',
    9: '📕 Class 9', 10: '📕 Class 10',
    11: '📓 Class 11', 12: '📓 Class 12',
};

const SUBJECT_FILTERS = [
    { key: 'mathematics', label: '🔢 Math' },
    { key: 'science', label: '🔬 Science' },
    { key: 'english', label: '📖 English' },
    { key: 'hindi', label: '🇮🇳 Hindi' },
    { key: 'social', label: '🌍 Social Sci' },
    { key: 'physics', label: '⚛️ Physics' },
    { key: 'chemistry', label: '🧪 Chemistry' },
    { key: 'biology', label: '🧬 Biology' },
    { key: 'commerce', label: '📊 Commerce' },
    { key: 'cs', label: '💻 CS' },
];

const SOCIAL_SUBJECTS = ['history', 'geography', 'civics', 'economics', 'polsci', 'political_science'];
const COMMERCE_SUBJECTS = ['accountancy', 'business', 'business_studies'];
const CS_SUBJECTS = ['computer_science', 'cs'];

function getSubjectGroup(course) {
    const s = course.subject;
    if (SOCIAL_SUBJECTS.includes(s)) return 'social';
    if (COMMERCE_SUBJECTS.includes(s)) return 'commerce';
    if (CS_SUBJECTS.includes(s)) return 'cs';
    return s;
}

async function loadCourses() {
    const loading = document.getElementById('loadingState');
    const main = document.getElementById('mainContent');

    try {
        const res = await fetch('/api/courses');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        allCourses = data.courses || [];

        loading.style.display = 'none';
        main.style.display = 'block';

        if (allCourses.length === 0) {
            document.getElementById('noResults').style.display = 'block';
            return;
        }

        buildFilters();
        buildCourseCards();
        updateStats();
        checkExpansion();
    } catch (e) {
        console.error('Failed to load courses:', e);
        loading.innerHTML = '<p style="color:#E74C3C">❌ Failed to load courses. Is the server running?</p>';
    }
}

function buildFilters() {
    const bar = document.getElementById('filterBar');
    const presentGroups = new Set(allCourses.map(getSubjectGroup));

    for (const f of SUBJECT_FILTERS) {
        if (!presentGroups.has(f.key)) continue;
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.filter = f.key;
        btn.textContent = f.label;
        btn.onclick = () => setFilter(f.key);
        bar.appendChild(btn);
    }
}

function setFilter(key) {
    activeFilter = (activeFilter === key) ? 'all' : key;
    document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active',
            b.dataset.filter === activeFilter ||
            (activeFilter === 'all' && b.dataset.filter === 'all'));
    });
    applyFilters();
}
document.getElementById('btnAll').onclick = () => {
    activeFilter = 'all';
    document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.filter === 'all');
    });
    applyFilters();
};

function applyFilters() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    let anyVisible = false;

    document.querySelectorAll('.course-card').forEach(card => {
        const cid = card.dataset.courseId;
        const course = allCourses.find(c => c.course_id === cid);
        if (!course) return;

        const group = getSubjectGroup(course);
        const matchesFilter = activeFilter === 'all' || group === activeFilter;
        const searchText = `${course.title} ${course.subject} ${course.description} class ${course.grade} grade ${course.grade} ${course.course_id}`.toLowerCase();
        const matchesSearch = !query || query.split(/\s+/).every(w => searchText.includes(w));

        const visible = matchesFilter && matchesSearch;
        card.classList.toggle('hidden', !visible);
        if (visible) anyVisible = true;
    });

    document.querySelectorAll('.grade-section').forEach(sec => {
        const hasVisible = sec.querySelectorAll('.course-card:not(.hidden)').length > 0;
        sec.classList.toggle('hidden', !hasVisible);
    });

    document.getElementById('noResults').style.display = anyVisible ? 'none' : 'block';
}

function buildCourseCards() {
    const main = document.getElementById('mainContent');

    // Group by grade
    const gradeMap = {};
    for (const c of allCourses) {
        const g = c.grade;
        if (!gradeMap[g]) gradeMap[g] = [];
        gradeMap[g].push(c);
    }

    // Sort grades: 1-12, then 0 at bottom
    const grades = Object.keys(gradeMap).map(Number).sort((a, b) => {
        if (a === 0) return 1;
        if (b === 0) return -1;
        return a - b;
    });

    for (const grade of grades) {
        const courses = gradeMap[grade];
        const section = document.createElement('div');
        section.className = 'grade-section';

        section.innerHTML = `
            <div class="grade-header">
                <span class="grade-label">${GRADE_LABELS[grade] || 'Class ' + grade}</span>
                <span class="grade-count">${courses.length} course${courses.length > 1 ? 's' : ''}</span>
            </div>
        `;

        const grid = document.createElement('div');
        grid.className = 'course-grid';

        for (const course of courses) {
            const card = document.createElement('div');
            card.className = 'course-card';
            card.dataset.courseId = course.course_id;
            card.onclick = () => window.location.href = `/course/${course.course_id}`;

            const color = course.color || '#4A90D9';
            card.innerHTML = `
                <div class="card-banner" style="background: linear-gradient(135deg, ${color}15, ${color}35);">
                    ${course.icon || '📖'}
                </div>
                <div class="card-body">
                    <h3>${course.title}</h3>
                    <div class="description">${course.description || ''}</div>
                    <div class="card-meta">
                        <span class="badge board">${course.board || 'General'}</span>
                        <span class="badge subject">${course.subject}</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        }

        section.appendChild(grid);
        main.insertBefore(section, document.getElementById('noResults'));
    }
}

function updateStats() {
    const stats = document.getElementById('heroStats');
    const subjects = new Set(allCourses.map(c => c.subject));
    stats.innerHTML = `
        <div><span>${allCourses.length}</span> Courses</div>
        <div>Class <span>1</span> to <span>12</span></div>
        <div><span>${subjects.size}</span> Subjects</div>
        <div>Powered by <span>Gemini</span></div>
    `;
}

async function checkExpansion() {
    try {
        const bar = document.getElementById('expansionBar');
        const sample = allCourses.find(c => c.grade === 12);
        if (sample) {
            const res = await fetch(`/api/courses/${sample.course_id}/concepts`);
            if (res.ok) {
                const data = await res.json();
                const totalConcepts = (data.chapters || []).reduce(
                    (sum, ch) => sum + (ch.concepts || []).length, 0);
                if (totalConcepts < 20) {
                    bar.style.display = 'block';
                    document.getElementById('expansionText').textContent =
                        '🧠 AI is enriching course curricula in the background — concepts are being added continuously.';
                }
            }
        }
    } catch (e) { /* ignore */ }
}

// Live search
document.getElementById('searchInput').addEventListener('input', applyFilters);

// Boot
loadCourses();
</script>

</body>
</html>
